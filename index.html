<script id="code">
(async function () {
  var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var S = JSON.parse(document.getElementById('state').textContent);
  var root = document.getElementById('root');
  var editing = false, canEdit = false, artifact = null, statusMsg = '';

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.append(arguments[i]);
    return parent;
  }
  function field(tag, path, val, ph, cls) {
    val = val || '';
    if (!editing && !val.trim()) return null;
    var e = el(tag, 'f' + (cls ? ' ' + cls : ''), val);
    e.dataset.path = path;
    e.dataset.ph = ph || '';
    if (editing) {
      try { e.contentEditable = 'plaintext-only'; } catch (x) {}
      if (e.contentEditable !== 'plaintext-only') e.contentEditable = 'true';
    }
    return e;
  }
  function setPath(obj, path, val) {
    var k = path.split('.'), o = obj;
    for (var i = 0; i < k.length - 1; i++) o = o[k[i]];
    o[k[k.length - 1]] = val;
  }
  function okUrl(u) { return /^https?:\/\/\S+$/i.test(u || ''); }

  function linkRow(path, arr) {
    var wrap = el('div', 'links');
    arr.forEach(function (l, i) {
      if (editing) {
        var row = el('div', 'linkrow');
        add(row, field('span', path + '.' + i + '.label', l.label, 'Label'), field('span', path + '.' + i + '.url', l.url, 'https://… (leave blank to hide)'));
        wrap.append(row);
      } else if (okUrl(l.url)) {
        var a = el('a', null, l.label || l.url);
        a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        wrap.append(a);
      }
    });
    return wrap.children.length ? wrap : null;
  }

  function rail() {
    var r = el('aside', 'rail');
    add(r, el('div', 'mark', 'Calliope Tulea'));
    var nav = el('nav');
    S.projects.forEach(function (p) {
      var a = el('a', null, p.title); a.href = '#p-' + p.id; nav.append(a);
    });
    var a2 = el('a', null, 'More'); a2.href = '#also'; nav.append(a2);
    r.append(nav);
    return r;
  }

  function hero() {
    var h = el('header', 'hero');
    add(h, el('p', 'kicker', S.hero.kicker),
      field('h1', 'hero.name', S.hero.name, 'Your name'),
      field('p', 'hero.tagline', S.hero.tagline, 'One line: what you do', 'tagline'),
      field('p', 'hero.intro', S.hero.intro, 'Two or three sentences in your own voice: what you build, and what you want to build next.', 'intro zone'),
      linkRow('hero.links', S.hero.links));
    var ie = h.querySelector('[data-path="hero.intro"]');
    if (ie && S.hero.introDraft) { ie.dataset.draft = 'hero.introDraft'; ie.dataset.orig = S.hero.intro; }
    return h;
  }

  function wins() {
    var w = el('section', 'wins');
    S.wins.forEach(function (x, i) {
      if (!editing && !(x.k.trim() || x.t.trim())) return;
      var c = el('div', 'win');
      add(c, field('div', 'wins.' + i + '.k', x.k, 'Headline', 'k'), field('div', 'wins.' + i + '.t', x.t, 'What for', 't'), field('div', 'wins.' + i + '.y', x.y, 'When', 'y'));
      w.append(c);
    });
    return w;
  }

  function project(p, pi) {
    var b = 'projects.' + pi;
    var s = el('section', 'proj'); s.id = 'p-' + p.id;
    var head = el('header');
    add(head, field('p', b + '.kicker', p.kicker, 'Type · year', 'kicker'),
      field('h2', b + '.title', p.title, 'Project name'),
      field('p', b + '.line', p.line, 'One sentence: what it is', 'line'));
    s.append(head);
    var dl = el('div', 'facts');
    p.meta.forEach(function (m, i) {
      if (!editing && !m.v.trim()) return;
      var row = el('div', 'fact' + (m.w ? ' wide' : ''));
      add(row, field('div', b + '.meta.' + i + '.k', m.k, 'Label', 'fk'), field('div', b + '.meta.' + i + '.v', m.v, m.ph || 'Value', 'fv'));
      dl.append(row);
    });
    var nf = Math.min(4, Math.max(1, dl.querySelectorAll('.fact:not(.wide)').length));
    dl.style.setProperty('--n', nf);
    if (dl.children.length) s.append(dl);
    if (p.gallery && p.gallery.length) {
      var g = el('div', 'gallery' + (p.gallery.length === 3 ? ' g3' : ''));
      p.gallery.forEach(function (im, i) {
        var fig = el('figure');
        var img = el('img'); img.src = im.src; img.alt = im.cap || p.title; img.loading = 'lazy';
        add(fig, img, field('figcaption', b + '.gallery.' + i + '.cap', im.cap, 'Caption'));
        g.append(fig);
      });
      s.append(g);
    }
    p.sections.forEach(function (sec, i) {
      var box = el('div', 'sec');
      var t = field('div', b + '.sections.' + i + '.text', sec.text, sec.ph, 'zone');
      if (!t) return;
      if (sec.draft) { t.dataset.draft = b + '.sections.' + i + '.draft'; t.dataset.orig = sec.text; }
      add(box, el('h3', null, sec.label), t);
      s.append(box);
    });
    var lr = linkRow(b + '.links', p.links);
    if (lr) s.append(lr);
    return s;
  }

  function also() {
    var s = el('section', 'proj'); s.id = 'also';
    var head = el('header');
    add(head, el('p', 'kicker', 'Also'), el('h2', null, 'More work'));
    s.append(head);
    var list = el('div', 'also');
    S.also.forEach(function (it, i) {
      if (!editing && !(it.t.trim() || it.d.trim())) return;
      var row = el('div');
      add(row, field('div', 'also.' + i + '.t', it.t, 'Title', 't'), field('div', 'also.' + i + '.d', it.d, 'One or two sentences', 'd'));
      list.append(row);
    });
    s.append(list);
    return s;
  }

  function countDraft() {
    var n = S.hero.introDraft ? 1 : 0;
    S.projects.forEach(function (p) { p.sections.forEach(function (x) { if (x.draft && x.text.trim()) n++; }); });
    return n;
  }
  function countEmpty() {
    var n = S.hero.intro.trim() ? 0 : 1;
    S.projects.forEach(function (p) { p.sections.forEach(function (x) { if (!x.text.trim()) n++; }); });
    return n;
  }

  function collect() {
    root.querySelectorAll('.f[data-path]').forEach(function (e) {
      var v = e.innerText.replace(/\n{3,}/g, '\n\n').trim();
      setPath(S, e.dataset.path, v);
      if (e.dataset.draft && v !== (e.dataset.orig || '').trim()) setPath(S, e.dataset.draft, false);
    });
  }

  function buildDoc() {
    var json = JSON.stringify(S).replace(/</g, '\\u003c');
    var css = document.getElementById('css').textContent;
    var code = document.getElementById('code').textContent;
    var font = document.querySelector('link[rel=stylesheet]').outerHTML;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>Calliope Tulea</title><meta name="claude:viewport-fit-sides" content="cover">' + font + '<style id="css">' + css + '</style>' +
      '<div id="root"></div><script id="state" type="application/json">' + json + '<\/script><script id="code">' + code + '<\/script></body></html>';
  }

  async function save(btn) {
    collect();
    btn.disabled = true; statusMsg = 'Publishing…'; paintStatus();
    try {
      await artifact.publish(buildDoc());
    } catch (err) {
      btn.disabled = false;
      statusMsg = (err && err.code === 'conflict') ? 'Someone saved first. Reload and redo your edit.' :
        'Could not publish: ' + ((err && (err.message || err.code)) || 'unknown error');
      paintStatus();
    }
  }
  function paintStatus() { var s = root.querySelector('.bar .status'); if (s) s.textContent = statusMsg; }

  function toolbar() {
    var bar = el('div', 'bar');
    var st = el('span', 'status');
    if (!editing) {
      var n = countEmpty();
      var d = countDraft();
      statusMsg = n + ' writing zones empty, ' + d + ' still Claude\u2019s first draft. Rewrite them in your own words.';
      var edit = el('button', 'btn primary', 'Edit page'); edit.type = 'button';
      edit.onclick = function () { editing = true; statusMsg = ''; render(); };
      add(bar, st, edit);
    } else {
      statusMsg = statusMsg || 'Click any dashed box and type. Nothing is public until you save.';
      var cancel = el('button', 'btn', 'Discard'); cancel.type = 'button';
      cancel.onclick = function () { editing = false; statusMsg = ''; render(); };
      var sv = el('button', 'btn primary', 'Save and publish'); sv.type = 'button';
      sv.onclick = function () { save(sv); };
      add(bar, st, cancel, sv);
    }
    st.textContent = statusMsg;
    return bar;
  }

  function render() {
    root.textContent = '';
    root.className = editing ? 'editing' : '';
    var shell = el('div', 'shell');
    var main = el('main');
    add(main, hero(), wins());
    S.projects.forEach(function (p, i) { main.append(project(p, i)); });
    main.append(also());
    add(shell, rail(), main);
    root.append(shell);
    if (canEdit && artifact) root.append(toolbar());
  }

  root.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains('f') && !t.textContent.trim()) t.textContent = '';
  });

  render();
  try {
    var c = window.claude;
    if (c && c.use) {
      var got = await Promise.all([c.use('user'), c.use('artifact')]);
      artifact = got[1];
      canEdit = !!(got[0] && got[0].canEdit && await got[0].canEdit());
      if (canEdit && artifact) render();
    }
  } catch (e) { /* page works read-only without capabilities */ }
})();
</script>
